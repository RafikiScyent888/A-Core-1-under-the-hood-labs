<!doctype html><html lang="en"><head><meta charset="utf-8"><title>sepad2</title>
<style>body{margin:0;background:#eceff0;color:#14181b;font:16px/1.5 system-ui,sans-serif}
.row{width:980px;margin:6px auto}h1{font-size:1.0rem;margin:10px 16px 2px}
#err{color:#7a1010;font-weight:700;padding:0 16px}</style></head><body>
<h1>Separation pad — early: chalky paper dust starting, texture still there</h1><div class="row" id="b"></div>
<h1>Separation pad — failed: worn through to the carrier, front edge lifting</h1><div class="row" id="d"></div>
<div id="err"></div>
<script type="module">
import * as S from "../assets/scene.js";
import { wearBench } from "../assets/bench-wear.js";
const err=document.getElementById("err");
window.addEventListener("error",e=>{err.textContent+="\n"+e.message;});
try{
 [["b","early","Going chalky grey, but the texture is still there"],
  ["d","failed","Worn through to the carrier, and the rubber is lifting off it"]]
 .forEach(([id,rung,look])=>S.mountScene(document.getElementById(id),
   wearBench({shape:"sepad",rung,label:"Separation pad",look}),{height:330}));
}catch(e){err.textContent="THREW: "+(e&&e.stack||e);}
</script></body></html>
