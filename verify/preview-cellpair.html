<!doctype html><html><head><meta charset="utf-8"><title>The two cells</title>
<style>body{margin:0;background:#eceff0;color:#14181b;font:15px/1.5 system-ui,sans-serif}
h1{font-size:1.05rem;margin:12px 14px 2px}p{margin:0 14px 8px;font-size:.86rem;color:#3a434b;max-width:88ch}
.w{width:600px;display:inline-block;vertical-align:top}h2{margin:6px 14px 0;font-size:.95rem}
#err{color:#7a1010;padding:0 14px;white-space:pre-wrap}</style></head><body>
<h1>The battery layer, and the reference card beside it</h1>
<p>Healthy on the left, swollen on the right. The tell is a <b>shape</b>: the laminate pillows, the
middle lifts and the printed label bends over the rise. Not a colour, not a bigger rectangle.
The geometry domes and the photograph carries the surface.</p>
<div id="wrap"></div><div id="err"></div>
<script type="module">
import * as S from "../assets/scene.js";
import { mobileBench } from "../assets/bench-mobile.js";
const wrap=document.getElementById("wrap"), err=document.getElementById("err");
try{
 for (const [sw,lbl] of [[false,"Healthy cell"],[true,"Swollen cell — stop"]]) {
   const d=document.createElement("div"); d.className="w";
   const h=document.createElement("h2"); h.textContent=lbl; d.appendChild(h);
   const host=document.createElement("div"); d.appendChild(host); wrap.appendChild(d);
   const spec = mobileBench({panel:"oled", swollen:sw, healthPct: sw?58:96,
     states:{battery: sw?"danger":"ok"}});
   spec.parts = spec.parts.filter(p => p.key==="layer-battery" || p.key==="battery-photo" || p.key.startsWith("card-"));
   spec.camera = { dist: 19, yaw: 0.26, pitch: 0.34, target: [-2.6, 1.8, -0.4], min: 6, max: 40 };
   S.mountScene(host, spec, { height: 480 });
 }
 window.__READY=true;
}catch(e){err.textContent="THREW: "+(e&&e.stack||e);}
</script></body></html>
