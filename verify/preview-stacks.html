<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Handset stacks — LCD and OLED</title>
<style>body{margin:0;background:#eceff0;color:#14181b;font:15px/1.5 system-ui,sans-serif}
.w{width:590px;display:inline-block;vertical-align:top}h2{margin:10px 14px 0;font-size:1rem}
p{margin:2px 14px 6px;font-size:.85rem;color:#3a434b}#err{color:#7a1010;padding:0 14px;white-space:pre-wrap}</style>
</head><body><div id="err"></div><div id="wrap"></div>
<script type="module">
import * as S from "../assets/scene.js";
import { mobileBench, layersFor } from "../assets/bench-mobile.js";
const err=document.getElementById("err"), wrap=document.getElementById("wrap");
try{
 for (const [panel,note] of [["oled","The owner\u2019s diagram, layer for layer. No backlight; the digitizer is bonded into the top glass."],
                             ["lcd","The other kind. A backlight to run the torch test on, and a digitizer you can buy on its own."]]) {
   const d=document.createElement("div"); d.className="w";
   const h=document.createElement("h2"); h.textContent=panel.toUpperCase()+" handset";
   const pp=document.createElement("p"); pp.textContent=note+"  ("+layersFor(panel).map(l=>l.label).join(" · ")+")";
   d.appendChild(h); d.appendChild(pp);
   const host=document.createElement("div"); d.appendChild(host); wrap.appendChild(d);
   S.mountScene(host, mobileBench({panel, swollen:false, cracked:true, healthPct:88,
     states:{glass:"faulty", digitizer:"suspect", polariser:"na", lcd:"ok", backlight:"na", midframe:"na", board:"na", battery:"ok", back:"na"}}),
     {height:660});
 }
 window.__READY=true;
}catch(e){err.textContent="THREW: "+(e&&e.stack||e);}
</script></body></html>
