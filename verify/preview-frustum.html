<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Calibrating frustumOK</title>
<style>body{margin:0;font:14px ui-monospace,monospace;background:#eef1f2;padding:14px}
pre{background:#fff;padding:10px;border-radius:6px;white-space:pre-wrap}</style></head><body>
<div id="host" style="width:319px"></div>
<pre id="out"></pre><div id="err"></div>
<script type="module">
import * as S from "../assets/scene.js";
import { mobileBench } from "../assets/bench-mobile.js";
const L=[];
try{
function build(extra) {
  const spec = mobileBench({ panel:"lcd", healthPct: 72,
    states:{back:"na",battery:"na",midframe:"na",backlight:"na",lcd:"na",digitizer:"na",glass:"faulty"} });
  if (extra) spec.parts = spec.parts.concat([extra]);
  return spec;
}
/* PLANT A PART THAT IS UNARGUABLY OFF THE SCREEN. If frustumOK does not
   name this, it cannot name anything. */
const planted = { key: "PLANTED-far-left", label: "planted", finish: "matte",
  color: "#ff0000", scale: 1, pos: [0,0,0],
  build: [{ shape: "box", size: [2,2,2], pos: [-500, 0, 0] }],
  spec: "planted", note: "planted" };

for (const [name, spec] of [["as shipped", build(null)], ["with a part at x = -500", build(planted)]]) {
  const host = document.createElement("div");
  host.style.width = "319px";
  document.getElementById("host").appendChild(host);
  const h = S.mountScene(host, spec, { height: 460 });
  /* .out, NOT the wrapper. frustumOK returns { out, parts } and reading
     .length straight off that object gives undefined, which is falsy —
     so a harness that does it reports a clean pass on every bench at
     every width, for ever. Cost an hour and a wrong conclusion. */
  const off = h.frustumOK().out;
  L.push(name.padEnd(26) + " -> " + (off.length ? off.join(", ") : "NOTHING FLAGGED"));
}
}catch(e){L.push("THREW: "+(e&&e.stack||e));}
document.getElementById("out").textContent = L.join("\n");
window.__READY=true;
</script></body></html>
