<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RAID bench — preview</title>
<style>
  :root { --paper: #eceff0; }
  body { margin: 0; background: #eceff0; color: #14181b;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { width: 1100px; margin: 12px auto; }
  h1 { font-size: 1.2rem; margin: 14px 16px 6px; }
  #err { color: #7a1010; font-weight: 700; padding: 0 16px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>RAID bench — RAID 5, bay 5 failed, bay 6 rebuilding</h1>
<div id="stage"></div>
<div id="err"></div>
<script type="module">
import * as S from "../assets/scene.js";
import { raidBench } from "../assets/bench-raid.js";

const err = document.getElementById("err");
window.addEventListener("error", e => { err.textContent += "\n" + e.message; });

try {
  const view = {
    level: "RAID 5",
    arrayState: "rebuilding",
    focus: 4,
    bays: [
      { state: "ok",         sizeTB: 4 },
      { state: "ok",         sizeTB: 4 },
      { state: "active",     sizeTB: 4 },
      { state: "predictive", sizeTB: 4 },
      { state: "failed",     sizeTB: 4 },
      { state: "rebuilding", sizeTB: 4 },
      { state: "spare",      sizeTB: 4 },
      { state: "empty" }
    ]
  };
  const spec = raidBench(view);
  const h = S.mountScene(document.getElementById("stage"), spec, { height: 560 });
  window.__ok = !!h;
  if (!h) err.textContent = "mountScene returned null (no WebGL?)";
} catch (e) {
  window.__ok = false;
  err.textContent = "THREW: " + (e && e.stack || e);
}
</script>
</body>
</html>
