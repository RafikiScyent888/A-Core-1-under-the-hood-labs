<!doctype html><html lang="en"><head><meta charset="utf-8"><title>office</title>
<style>body{margin:0;background:#eceff0;color:#14181b;font:16px/1.5 system-ui,sans-serif}
.row{width:1100px;margin:6px auto}h1{font-size:1.0rem;margin:10px 16px 2px}
#err{color:#7a1010;font-weight:700;padding:0 16px}</style></head><body>
<!-- All three of the core path's new benches, and BOTH kinds of site:
     one with a data point on the wall and one without, so the network
     outlet is actually exercised. The first cut of this page showed only
     the counter, and the visibility instrument duly reported dataPoint
     as painting nothing — correctly, because nothing ever called it. -->
<h1>brief — the shop counter (no data point on the wall)</h1><div class="row" id="a"></div>
<h1>brief — the general office (data point present)</h1><div class="row" id="c"></div>
<h1>deploy — the back of it, and the wall behind</h1><div class="row" id="b"></div>
<h1>duty — 9,000 pages a month against a 50,000 rating</h1><div class="row" id="d"></div>
<div id="err"></div>
<script type="module">
import * as S from "../assets/scene.js";
import { siteBench, rearBench, volumeBench } from "../assets/bench-office.js";
const err=document.getElementById("err");
window.addEventListener("error",e=>{err.textContent+="\n"+e.message;});
try{
  S.mountScene(document.getElementById("a"), siteBench({place:"till"}), {height:330});
  S.mountScene(document.getElementById("c"), siteBench({place:"office"}), {height:330});
  S.mountScene(document.getElementById("b"), rearBench({}), {height:330});
  S.mountScene(document.getElementById("d"), volumeBench({monthly:9000, rated:50000}), {height:330});
}catch(e){err.textContent="THREW: "+(e&&e.stack||e);}
</script></body></html>
