<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Network bench — preview</title>
<style>
  :root { --paper: #eceff0; }
  body { margin: 0; background: #eceff0; color: #14181b;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { width: 980px; margin: 12px auto; }
  h1 { font-size: 1.2rem; margin: 14px 16px 6px; }
  #err { color: #7a1010; font-weight: 700; padding: 0 16px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Network bench — walked as far as the switch, fault at the patch panel</h1>
<div id="stage"></div>
<div id="err"></div>
<script type="module">
import * as S from "../assets/scene.js";
import { netBench } from "../assets/bench-net.js";
const err = document.getElementById("err");
window.addEventListener("error", e => { err.textContent += "\n" + e.message; });
try {
  const spec = netBench({
    states: { wan:"ok", modem:"ok", router:"ok", switch:"ok",
              panel:"faulty", wall:"unknown", client:"suspect" },
    links: { "panel-wall": false }
  });
  const h = S.mountScene(document.getElementById("stage"), spec, { height: 380 });
  window.__ok = !!h;
  if (!h) err.textContent = "mountScene returned null";
} catch (e) { window.__ok = false; err.textContent = "THREW: " + (e && e.stack || e); }
</script>
</body>
</html>
