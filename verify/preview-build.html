<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build bench — preview</title>
<style>
  :root { --paper: #eceff0; }
  body { margin: 0; background: #eceff0; color: #14181b;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { width: 1100px; margin: 12px auto; }
  h1 { font-size: 1.2rem; margin: 14px 16px 6px; }
  #err { color: #7a1010; font-weight: 700; padding: 0 16px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Build bench — everything fitted, cooler fouling the case</h1>
<div id="stage"></div>
<div id="err"></div>
<script type="module">
import * as S from "../assets/scene.js";
import { buildBench } from "../assets/bench-build.js";
const err = document.getElementById("err");
window.addEventListener("error", e => { err.textContent += "\n" + e.message; });
try {
  const spec = buildBench({
    slots: 4, m2Shared: true,
    cpuLabel: "Meritas W5-2455",
    coolerMm: 169, gpuMm: 300,
    ramIn: [0, 2],
    fitted: { cpu:"ok", cooler:"foul", ram:"ok", gpu:"seated", psu24:"ok", eps:"refused", m2:"warn" },
    foul: { part:"cooler", w:3.4, limit:6.4, d:3.4 }
  });
  const h = S.mountScene(document.getElementById("stage"), spec, { height: 620 });
  window.__ok = !!h;
  if (!h) err.textContent = "mountScene returned null";
} catch (e) { window.__ok = false; err.textContent = "THREW: " + (e && e.stack || e); }
</script>
</body>
</html>
