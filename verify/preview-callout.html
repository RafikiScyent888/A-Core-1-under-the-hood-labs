<!doctype html><html lang="en"><head><meta charset="utf-8"><title>fit stage — preview</title>
<link rel="stylesheet" href="../assets/style.css">
<style>body{margin:0}#host{max-width:1080px;margin:12px auto;padding:0 16px}
#err{color:#7a1010;font-weight:700;padding:0 16px;white-space:pre-wrap}</style></head><body>
<div id="host"></div><div id="err"></div>
<script type="module">
const err=document.getElementById("err");
window.addEventListener("error",e=>{err.textContent+="\n"+e.message;});
window.addEventListener("unhandledrejection",e=>{err.textContent+="\nPROMISE "+((e.reason&&e.reason.message)||e.reason);});
try{
  const L=await import("../assets/lab-printer.js");
  const R=await import("../assets/runner.js");
  const s=L.generate(100006);
  const r=R.createRunner(document.getElementById("host"), {
    lab:L, stages:[L.buildStage("callout", s)], scenario:s,
    onProgress(){}, onDone(){}
  });
  window.__READY=true;
}catch(e){err.textContent="THREW: "+(e&&e.stack||e);}
</script></body></html>
