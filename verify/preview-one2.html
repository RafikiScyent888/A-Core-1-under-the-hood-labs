<!doctype html><html lang="en"><head><meta charset="utf-8"><title>showroom frame</title>
<style>body{margin:0;background:#eceff0}.row{width:100%}#err{color:#7a1010;padding:0 16px}</style>
</head><body>
<!-- One showroom bench at whatever width the viewport is, so frustumOK
     can be asked whether all six machines are inside the frame. -->
<div class="row" id="a"></div><div id="err"></div>
<script type="module">
import * as S from "../assets/scene.js";
import { showroomBench } from "../assets/bench-showroom.js";
const err=document.getElementById("err");
window.addEventListener("error",e=>{err.textContent+="\n"+e.message;});
try{ S.mountScene(document.getElementById("a"), showroomBench({}), {height:520}); }
catch(e){err.textContent="THREW: "+(e&&e.stack||e);}
</script></body></html>
