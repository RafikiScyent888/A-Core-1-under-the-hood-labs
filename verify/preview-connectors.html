<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Connectors</title>
<style>body{margin:0;background:#11161b;color:#e8edf2;font:15px/1.5 system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:14px 18px 28px}
h1{font-size:1.1rem;margin:4px 0 8px}.cap{font-weight:700;margin:10px 0 4px;font-size:.92rem}
#err{color:#ff9;white-space:pre-wrap}</style></head><body><div class="wrap">
<h1>What arrives at the demarc &mdash; and what always leaves</h1>
<p class="cap">All four at one scale (1 unit = 2 mm)</p><div id="a"></div>
<p class="cap">RJ11 against RJ45, front on &mdash; six positions with four used, against eight</p><div id="b"></div>
<div id="err"></div></div>
<script type="module">
const err=document.getElementById("err");
window.addEventListener("error",e=>{err.textContent+="\n"+e.message;});
try{
  const S=await import("../assets/scene.js");
  const { connectorBench }=await import("../assets/bench-net.js");
  window.__SCENE=S.mountScene(document.getElementById("a"), connectorBench({}), {height:380});
  const close=connectorBench({});
  close.parts=close.parts.filter(p=>/rj11|rj45/i.test(p.key));
  /* front on, which is where both plugs are read */
  close.camera={dist:20,fitWidth:24,yaw:0.20,pitch:0.16,target:[10.5,0,4],min:5,max:60};
  S.mountScene(document.getElementById("b"), close, {height:400});
  window.__READY=true;
}catch(e){err.textContent="THREW: "+(e&&e.stack||e);}
</script></body></html>
