<!doctype html><html lang="en"><head><meta charset="utf-8"><title>focused bench — fit sweep</title>
<style>body{margin:0;background:#11161b}#host{margin:0}</style></head><body>
<div id="host"></div>
<script type="module">
/* One focused bench, one canvas width, one fitWidth — per page load.
   One bench per load is not fussiness: the browser caps live WebGL
   contexts around sixteen, and a sweep mounted on one page loses the
   later ones silently, which reads exactly like a bench that fits. */
const q = new URLSearchParams(location.search);
try{
  const S = await import("../assets/scene.js");
  const { mobileBench } = await import("../assets/bench-mobile.js");
  /* focus may be a comma list — that is the mode the panel-parts stage
     runs in, and sweeping a single layer would measure a bench nothing
     mounts. */
  const focus = (q.get("focus") || "lcd").split(",");
  const spec = mobileBench({ panel: "lcd", focus: focus.length > 1 ? focus : focus[0],
                             states: {}, healthPct: 88 });
  if (q.get("fw")) spec.camera = Object.assign({}, spec.camera, { fitWidth: Number(q.get("fw")) });
  const host = document.getElementById("host");
  host.style.width = (q.get("w") || 1100) + "px";
  window.__SCENE = S.mountScene(host, spec, { height: Number(q.get("h") || 460) });
  window.__READY = true;
}catch(e){ window.__THREW = String(e && e.stack || e); }
</script></body></html>
