<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Power bench — preview</title>
<style>
  :root { --paper: #eceff0; }
  body { margin: 0; background: #eceff0; color: #14181b;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { width: 1100px; margin: 12px auto; }
  h1 { font-size: 1.2rem; margin: 14px 16px 6px; }
  #err { color: #7a1010; font-weight: 700; padding: 0 16px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Power bench — 455 W machine on a 500 W supply, +12 V low</h1>
<div id="stage"></div>
<div id="err"></div>
<script type="module">
import * as S from "../assets/scene.js";
import { powerBench } from "../assets/bench-power.js";
const err = document.getElementById("err");
window.addEventListener("error", e => { err.textContent += "\n" + e.message; });
try {
  const spec = powerBench({
    sockets: { mb:"ok", cpu:"missing", gpu:"ok", ssd:"ok", fan:"wrong", panel:"open" },
    drawW: 455, suppliedW: 500, headroomW: 400, probe: "12v"
  });
  const h = S.mountScene(document.getElementById("stage"), spec, { height: 620 });
  window.__ok = !!h;
  if (!h) err.textContent = "mountScene returned null";
} catch (e) { window.__ok = false; err.textContent = "THREW: " + (e && e.stack || e); }
</script>
</body>
</html>
