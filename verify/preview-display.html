<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Display bench — preview</title>
<style>
  :root { --paper: #eceff0; }
  body { margin: 0; background: #eceff0; color: #14181b;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { width: 1100px; margin: 12px auto; }
  h1 { font-size: 1.2rem; margin: 14px 16px 6px; }
  #err { color: #7a1010; font-weight: 700; padding: 0 16px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Display bench — backlight dead, panel fine, USB-C is the only port that carries video</h1>
<div id="stage"></div>
<div id="err"></div>
<script type="module">
import * as S from "../assets/scene.js";
import { displayBench } from "../assets/bench-display.js";
const err = document.getElementById("err");
window.addEventListener("error", e => { err.textContent += "\n" + e.message; });
try {
  const spec = displayBench({
    states: { back:"na", psu:"ok", driver:"ok", backlight:"faulty", panel:"ok", bezel:"suspect" },
    ports: { vga:"na", dvi:"na", hdmi:"faulty", dp:"na", usbc:"ok", tb:"suspect" },
    artefact: null, cracked: false
  });
  const h = S.mountScene(document.getElementById("stage"), spec, { height: 620 });
  window.__ok = !!h;
  if (!h) err.textContent = "mountScene returned null";
} catch (e) { window.__ok = false; err.textContent = "THREW: " + (e && e.stack || e); }
</script>
</body>
</html>
