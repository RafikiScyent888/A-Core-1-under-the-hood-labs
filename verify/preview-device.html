<!doctype html><html lang="en"><head><meta charset="utf-8"><title>device symptom — preview</title>
<link rel="stylesheet" href="../assets/style.css">
<style>body{margin:0;background:#14171f}#host{width:1000px;height:560px}</style></head><body>
<div id="host"></div><div id="err" style="color:#ff9;white-space:pre-wrap"></div>
<script type="module">
/* The symptom is the ONLY input, so a whole-canvas diff isolates it. */
const err=document.getElementById("err");
window.addEventListener("error",e=>{err.textContent+="\n"+e.message;});
try{
  const D=await import("../assets/bench-display.js");
  const S=await import("../assets/bench.js");
  const q=new URLSearchParams(location.search);
  const kind=q.get("kind")||"monitor";
  const art=q.get("art")==="none"?null:q.get("art");
  S.mountBench(document.getElementById("host"), {
    height:560,
    spec:()=>D.deviceBench({kind:kind, art:art, dark:art==="nosignal"||art==="hotspot", collapsed:art==="wedge"}),
    status:()=>({tone:"warn",words:"preview",detail:"preview"}),
    controls:()=>[], onAction:()=>({})
  });
  window.__READY=true;
}catch(e){err.textContent="THREW: "+(e&&e.stack||e);}
</script></body></html>
