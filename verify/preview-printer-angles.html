<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Printer bench — angles</title>
<style>body{margin:0;background:#eceff0;font:15px system-ui,sans-serif}h2{margin:6px 12px 0;font-size:.9rem}
.w{width:580px;display:inline-block}#err{color:#7a1010;padding:0 12px;white-space:pre-wrap}</style></head><body>
<div id="err"></div><div id="wrap"></div>
<script type="module">
import * as S from "../assets/scene.js";
import { printerBench } from "../assets/bench-printer.js";
const err=document.getElementById("err"), wrap=document.getElementById("wrap");
try{
 for (const p of [0.18,0.32,0.46,0.60]) {
   const d=document.createElement("div"); d.className="w";
   const h2=document.createElement("h2"); h2.textContent="pitch "+p; d.appendChild(h2);
   const host=document.createElement("div"); d.appendChild(host); wrap.appendChild(d);
   const spec=printerBench({tech:"laser",sheets:11,sheetAt:0.45,
     states:{processing:"ok",charging:"ok",exposing:"ok",developing:"worn",transferring:"faulty",fusing:"ok",cleaning:"ok"}});
   spec.camera={dist:26.5,yaw:0.20,pitch:p,target:[0.4,6.4,0],min:10,max:52};
   S.mountScene(host,spec,{height:380});
 }
 window.__READY=true;
}catch(e){err.textContent="THREW: "+(e&&e.stack||e);}
</script></body></html>
