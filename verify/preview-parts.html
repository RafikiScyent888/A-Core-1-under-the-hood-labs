<!doctype html><html lang="en"><head><meta charset="utf-8"><title>workstation parts — preview</title>
<link rel="stylesheet" href="../assets/style.css">
<style>body{margin:0;background:#14171f}#host{width:1100px;height:640px}</style></head><body>
<div id="host"></div><div id="err" style="color:#ff9;white-space:pre-wrap"></div>
<script type="module">
const err=document.getElementById("err");
window.addEventListener("error",e=>{err.textContent+="\n"+e.message;});
try{
  const B=await import("../assets/bench-build.js");
  const S=await import("../assets/bench.js");
  const q=new URLSearchParams(location.search);
  const what=q.get("what")||"card";
  const view = what==="psu"
    ? { slots:4, psu:true, gpuMm:0, coolerMm:0,
        fitted:{cpu:"empty",cooler:"empty",ram:"empty",gpu:"empty",psu24:"ok",eps:"ok",m2:"ok"}, ramIn:[] }
    : what==="cooler"
    ? { slots:4, gpuMm:0, coolerMm:160, cpuLabel:"fitted",
        fitted:{cpu:"ok",cooler:"ok",ram:"ok",gpu:"empty",psu24:"ok",eps:"ok",m2:"ok"}, ramIn:[0,2] }
    : { slots:4, gpuMm:300, coolerMm:0, cpuLabel:"fitted",
        fitted:{cpu:"ok",cooler:"empty",ram:"ok",gpu:"seated",psu24:"ok",eps:"ok",m2:"ok"}, ramIn:[0,2] };
  const spec = B.buildBench(view);
  if (q.get("close")) spec.camera = { dist: 13, yaw: 0.35, pitch: 0.5, target: [1.5, 1.2, 6.4], min: 5, max: 40 };
  if (what==="psu" && q.get("close")) spec.camera = { dist: 14, yaw: 0.5, pitch: 0.42, target: [0, 1.6, 6.6], min: 5, max: 40 };
  S.mountBench(document.getElementById("host"), {
    height:640, spec:()=>spec,
    status:()=>({tone:"calm",words:"preview",detail:"preview"}),
    controls:()=>[], onAction:()=>({})
  });
  window.__READY=true;
}catch(e){err.textContent="THREW: "+(e&&e.stack||e);}
</script></body></html>
