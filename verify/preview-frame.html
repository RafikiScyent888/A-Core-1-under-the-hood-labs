<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Every bench, at every width</title>
<style>body{margin:0;font:13px ui-monospace,monospace;background:#eef1f2;padding:10px}
pre{background:#fff;padding:10px;border-radius:6px}</style></head><body>
<div id="host"></div><pre id="out"></pre><div id="err"></div>
<script type="module">
/* EVERY BENCH, AT THE CANVAS WIDTHS A STUDENT ACTUALLY GETS.

   The suite renders at 1100px and nothing else, so "does a student on a
   phone see the whole bench" had never been asked. The field of view is
   VERTICAL, so a narrow canvas shows LESS world width at the same
   distance — the failure `camera.fitWidth` exists for.

   WIDTHS are canvas widths, not viewport widths, measured off the running
   lab: 319 inside a 390px phone, 697 inside a 768px tablet, 889 inside a
   1280px laptop. 480 is in between.

   HEIGHT IS 460 AND THAT IS THE DEMANDING CASE. The labs mount benches
   between 320 and 420 tall, and a TALLER canvas at the same width has a
   SMALLER aspect, which shows less width. Fit at 460 and every shorter
   mount is covered.

   READ `.out`, NEVER `.length`. frustumOK returns { out, parts }, and
   reading length off that wrapper gives undefined, which is falsy, which
   is a harness reporting a clean pass on every bench at every width for
   ever. That happened, and it produced a confident wrong conclusion that
   the engine was blind. It is not.

   ONE BENCH AND ONE WIDTH PER PAGE LOAD, from ?bench=&w=. The first cut
   mounted all of them at four widths on one page and produced NOTHING:
   that is sixty-odd WebGL contexts against a browser cap around sixteen,
   so the later ones lose their context and the page never finishes. A
   harness that quietly stops is worse than one that fails.

   ?fw= and ?maxd= override camera.fitWidth and camera.max, which is how
   the values in the benches were SWEPT rather than picked. */
import * as S from "../assets/scene.js";
const Q = new URLSearchParams(location.search);
const WIDTHS = [Number(Q.get("w") || 319)];
const ONLY = Q.get("bench");
const FW = Q.get("fw") ? Number(Q.get("fw")) : null;
const MAXD = Q.get("maxd") ? Number(Q.get("maxd")) : null;
const L = [], host = document.getElementById("host");

/* EVERY BENCH FUNCTION THAT EXISTS, not every bench MODULE. The first
   audit listed one "officeBench" and reported "?" for it for ever, because
   there is no such export — bench-office.js carries SIX benches, and
   power and display carry two each. A row that cannot resolve is not a
   row that passes. */
const BENCHES = [
  ["mobile-lcd",  "bench-mobile",   "mobileBench", { panel: "lcd", healthPct: 72,
      states: { back:"na",battery:"na",midframe:"na",backlight:"na",lcd:"na",digitizer:"na",glass:"faulty" } }],
  ["mobile-oled", "bench-mobile",   "mobileBench", { panel: "oled", healthPct: 40, swollen: true,
      states: { back:"na",battery:"faulty",midframe:"na",lcd:"na",polariser:"na",glass:"na" } }],
  ["raid",        "bench-raid",     "raidBench",     {}],
  ["net",         "bench-net",      "netBench",      {}],
  ["display",     "bench-display",  "displayBench",  {}],
  ["device",      "bench-display",  "deviceBench",   {}],
  ["build",       "bench-build",    "buildBench",    {}],
  ["power",       "bench-power",    "powerBench",    {}],
  ["outlet",      "bench-power",    "outletBench",   {}],
  ["wap",         "bench-wap",      "wapBench",      {}],
  ["printer",     "bench-printer",  "printerBench",  {}],
  ["showroom",    "bench-showroom", "showroomBench", {}],
  ["site",        "bench-office",   "siteBench",     {}],
  ["rear",        "bench-office",   "rearBench",     {}],
  /* A VIEW, NOT AN EMPTY ONE. volumeBench draws two piles of paper
     counted from `monthly` and `rated`, so calling it with {} gives two
     piles of nothing and a single loose ream — 0.7% of the canvas, which
     the ink check duly failed it for. The bench was right and the roster
     was wrong: a bench measured in a state no student ever sees is not
     being measured. These are the figures a mid-volume job generates. */
  ["volume",      "bench-office",   "volumeBench",   { monthly: 9000, rated: 20000 }],
  ["kit",         "bench-office",   "kitBench",      {}],
  ["mfp",         "bench-office",   "mfpBench",      {}],
  ["floor",       "bench-office",   "floorBench",    {}],
  ["thermal",     "bench-thermal",  "thermalBench",  {}],
  ["impact",      "bench-impact",   "impactBench",   {}],
  ["inkjet",      "bench-inkjet",   "inkjetBench",   {}],
  ["wear",        "bench-wear",     "wearBench",     {}],
  /* EVERYTHING BUILT SINCE THE FRAMING CHECK WAS WRITTEN. Nine benches
     went in — three on the net lab, two access points, video ends, the
     PSU loom and its rear panel, the UPS, and the two screen benches —
     and NONE of them was in this list, so the question "does a student
     on a phone see the whole thing" had never been asked of any of them.
     The check was written down and the new work was outside it, which is
     the same failure as a stage that is registered and never driven. */
  ["rj45",        "bench-net",      "rj45Bench",      {}],
  ["connector",   "bench-net",      "connectorBench", {}],
  ["fibre",       "bench-net",      "fibreBench",     {}],
  ["ap-mount",    "bench-ap",       "apBench",        {}],
  ["ap-antenna",  "bench-ap",       "apBench",        { show: "antenna" }],
  ["video",       "bench-video",    "videoBench",     {}],
  ["psu-loom",    "bench-psu",      "psuBench",       {}],
  ["psu-rear",    "bench-psu",      "psuBench",       { show: "rear" }],
  ["psu-ups",     "bench-psu",      "psuBench",       { show: "ups" }],
  ["screen",      "bench-screen",   "screenBench",    {}],
  ["projector",   "bench-screen",   "screenBench",    { show: "projector" }]
];
try {
  for (const [name, mod, fn, view] of BENCHES) {
    if (ONLY && name !== ONLY) continue;
    let make;
    try { const m = await import("../assets/" + mod + ".js"); make = m[fn]; }
    catch (e) { L.push(name.padEnd(13) + " MODULE FAILED: " + e.message); continue; }
    if (typeof make !== "function") { L.push(name.padEnd(13) + " NO EXPORT " + fn); continue; }
    const row = [];
    for (const w of WIDTHS) {
      let n;
      try {
        const spec = make(view);
        /* ?noboard=1 drops the mat and the scenery, leaving only the
           PARTS. The ink check needs this: a bench mat is a table top and
           it is supposed to run off the edges of the frame, so measuring
           painted pixels with the mat in place measures the tablecloth —
           fourteen of thirty-three benches "touched the bottom edge" at
           exactly the last pixel row, and the only three that came back
           clean were the three with no mat at all. */
        if (Q.get("noboard")) { spec.board = null; spec.decor = []; }
        if (FW !== null) spec.camera.fitWidth = FW;
        if (MAXD !== null) spec.camera.max = MAXD;
        const d = document.createElement("div");
        d.style.width = w + "px";
        host.appendChild(d);
        n = S.mountScene(d, spec, { height: 460 }).frustumOK().out.length;
      } catch (e) { n = "ERR:" + e.message.slice(0, 40); }
      row.push(String(n).padStart(4));
    }
    L.push(name.padEnd(13) + row.join(" "));
  }
} catch (e) { document.getElementById("err").textContent = "THREW: " + (e && e.stack || e); }
document.getElementById("out").textContent = L.join("\n");
window.__READY = true;
</script></body></html>
