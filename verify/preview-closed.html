<!doctype html><html lang="en"><head><meta charset="utf-8"><title>The handset as it came in</title>
<style>body{margin:0;background:#11161b;color:#e8edf2;font:15px/1.5 system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:12px 16px 28px}
h1{font-size:1.1rem;margin:4px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap}.cell{flex:1 1 420px}
.cap{font-weight:700;margin:0 0 4px;font-size:.92rem}
#err{color:#ff9;font-weight:700;white-space:pre-wrap}</style></head><body><div class="wrap">
<h1>Stage one &mdash; the phone as the customer handed it over</h1>
<div class="row">
  <div class="cell"><p class="cap">Nothing wrong with the front</p><div id="a"></div></div>
  <div class="cell"><p class="cap">Cracked screen, picture still running underneath</p><div id="b"></div></div>
</div>
<div id="err"></div></div>
<script type="module">
const err=document.getElementById("err");
window.addEventListener("error",e=>{err.textContent+="\n"+e.message;});
try{
  const S=await import("../assets/scene.js");
  const { mobileBench }=await import("../assets/bench-mobile.js");
  const q=new URLSearchParams(location.search);
  const w=q.get("w");
  for (const [host,cracked] of [["a",false],["b",true]]) {
    const spec=mobileBench({ panel:"lcd", exploded:false, cracked, states:{}, healthPct:88 });
    if (q.get("fw")) spec.camera=Object.assign({},spec.camera,{fitWidth:Number(q.get("fw"))});
    const el=document.getElementById(host);
    if (w) el.style.width=w+"px";
    window["__SCENE_"+host]=S.mountScene(el, spec, { height:Number(q.get("h")||460) });
  }
  window.__SCENE=window.__SCENE_a;
  window.__READY=true;
}catch(e){err.textContent="THREW: "+(e&&e.stack||e);}
</script></body></html>
