<!doctype html><html lang="en"><head><meta charset="utf-8"><title>r</title>
<style>body{margin:0;background:#eceff0;color:#14181b;font:16px/1.5 system-ui,sans-serif}
.row{width:980px;margin:6px auto}h1{font-size:1.0rem;margin:10px 16px 2px}
#err{color:#7a1010;font-weight:700;padding:0 16px}</style></head><body>
<h1>Pickup roller — worn: the tread is going smooth</h1><div class="row" id="a"></div>
<h1>Pickup roller — worn, and somebody has wound rubber bands round it to keep it picking</h1><div class="row" id="b"></div>
<div id="err"></div>
<script type="module">
import * as S from "../assets/scene.js";
import { wearBench } from "../assets/bench-wear.js";
const err=document.getElementById("err");
window.addEventListener("error",e=>{err.textContent+="\n"+e.message;});
try{
 S.mountScene(document.getElementById("a"),wearBench({shape:"roller",rung:"worn",
   label:"Pickup roller",look:"Glazed hard and shiny, tread almost gone."}),{height:330});
 S.mountScene(document.getElementById("b"),wearBench({shape:"roller",rung:"worn",bodged:true,
   label:"Pickup roller",look:"Rubber bands wound round it to restore grip."}),{height:330});
}catch(e){err.textContent="THREW: "+(e&&e.stack||e);}
</script></body></html>
