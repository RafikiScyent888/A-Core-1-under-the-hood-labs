<!doctype html><html lang="en"><head><meta charset="utf-8"><title>office3</title>
<style>body{margin:0;background:#eceff0;color:#14181b;font:16px/1.5 system-ui,sans-serif}
.row{width:1100px;margin:6px auto}h1{font-size:1.0rem;margin:10px 16px 2px}
#err{color:#7a1010;font-weight:700;padding:0 16px}</style></head><body>
<h1>consum — what is in the maintenance kit, and what is not</h1><div class="row" id="a"></div>
<h1>scanflow — the machine, and what is lying in its tray</h1><div class="row" id="b"></div>
<h1>fleet — the department from above</h1><div class="row" id="c"></div>
<div id="err"></div>
<script type="module">
import * as S from "../assets/scene.js";
import { kitBench, mfpBench, floorBench } from "../assets/bench-office.js";
const err=document.getElementById("err");
window.addEventListener("error",e=>{err.textContent+="\n"+e.message;});
try{
  S.mountScene(document.getElementById("a"), kitBench({}), {height:330});
  S.mountScene(document.getElementById("b"), mfpBench({}), {height:330});
  S.mountScene(document.getElementById("c"), floorBench({}), {height:330});
}catch(e){err.textContent="THREW: "+(e&&e.stack||e);}
</script></body></html>
