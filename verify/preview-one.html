<!doctype html><html lang="en"><head><meta charset="utf-8"><title>one wear bench</title>
<style>body{margin:0;background:#eceff0;color:#14181b;font:16px/1.5 system-ui,sans-serif}
.row{width:100%;margin:0}#err{color:#7a1010;font-weight:700;padding:0 16px}</style></head><body>
<!-- One bench, chosen by #shape/rung, so framing can be measured per shape
     at several canvas widths with frustumOK(). The multi-panel previews
     leave window.__SCENE pointing at whichever bench mounted last, which
     is no good for asking "does THIS one fit". -->
<div class="row" id="a"></div><div id="err"></div>
<script type="module">
import * as S from "../assets/scene.js";
import { wearBench } from "../assets/bench-wear.js";
const err=document.getElementById("err");
window.addEventListener("error",e=>{err.textContent+="\n"+e.message;});
const [shape,rung]=(location.hash.slice(1)||"roller/worn").split("/");
try{
  S.mountScene(document.getElementById("a"),
    wearBench({shape,rung,label:shape,look:"preview"}),{height:520});
}catch(e){err.textContent="THREW: "+(e&&e.stack||e);}
</script></body></html>
